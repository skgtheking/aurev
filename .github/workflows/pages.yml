name: Deploy Aurev to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# No repository writes; only the deployment job can publish a Pages artifact.
permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

env:
  EXPO_NO_TELEMETRY: "1"
  CI: "true"

jobs:
  build:
    # Prevent accidental deployment from a fork or the separate portfolio repo.
    if: github.repository == 'skgtheking/aurev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Aurev
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, lint and test
        run: npm run check
      - name: Export and verify the Pages site
        run: npm run export:web
      - name: Check subpath hosting and deep-link fallbacks
        run: npm run test:pages
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    if: github.repository == 'skgtheking/aurev' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
