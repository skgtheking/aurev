name: Android Preview Validation
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tests/**'
      - '.github/workflows/android-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx expo export --platform android --output-dir dist-android-validation
      - name: Inspect Android bundle
        run: test -n "$(find dist-android-validation -type f -name '*.hbc' -o -name '*.js' | head -n 1)"
